<script>
const KEY='obmep_simulados_2026_v1';
const DRAFT_KEY='obmep_simulados_2026_drafts_v1';
let gradeDraft=loadDraft();
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}')}catch(e){return {}}}
function persistDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(gradeDraft));return true}catch(e){msg('Não foi possível guardar o rascunho neste navegador. Exporte um backup antes de continuar.');return false}}
function draftValue(sid,mid){const k=gradeKey(sid,mid);if(Object.prototype.hasOwnProperty.call(gradeDraft,k))return gradeDraft[k];return getGrade(sid,mid)}
function captureDraft(el){const k=el.dataset.grade;gradeDraft[k]=el.value;persistDraft() }
function upperField(el){const pos=el.selectionStart;el.value=el.value.toLocaleUpperCase('pt-BR');try{el.setSelectionRange(pos,pos)}catch(e){}}
const defaults={students:[],simulations:[],grades:{},savedAt:null};
let data=load(),page='inicio',search='',levelFilter='Todos',editingStudent=null,editingSim=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(t){let n=document.getElementById('notice');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),4200)}
function nav(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));closeMenu();render()}
function closeMenu(){document.getElementById('nav').classList.remove('open');document.getElementById('navScrim').classList.remove('show');document.getElementById('menuToggle').setAttribute('aria-expanded','false')}
document.getElementById('menuToggle').addEventListener('click',()=>{const n=document.getElementById('nav');if(window.matchMedia('(max-width: 1000px)').matches){const open=!n.classList.contains('open');n.classList.toggle('open',open);document.getElementById('navScrim').classList.toggle('show',open);document.getElementById('menuToggle').setAttribute('aria-expanded',String(open))}else{document.querySelector('.workspace').classList.toggle('menu-collapsed');document.getElementById('menuToggle').setAttribute('aria-expanded',String(!document.querySelector('.workspace').classList.contains('menu-collapsed')))}});
document.getElementById('navScrim').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('input',e=>{if(e.target.matches('#stname,#stschool,#simname'))upperField(e.target)});
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2)}
function sim(id){return data.simulations.find(s=>s.id===id)}
function student(id){return data.students.find(s=>s.id===id)}
function gradeKey(sid,mid){return sid+'::'+mid}
function getGrade(sid,mid){let v=data.grades[gradeKey(sid,mid)];if(v===undefined||v===null)return '';return typeof v==='object'?(v.score??''):v}
function classify(score,s){
 if(score===''||score===null||!Number.isFinite(Number(score)))return {nat:'Não calculada',est:'Não calculada'};
 let n=Number(score),nat='Sem Premiação Nacional',est='Sem Premiação Estadual';
 if(n>=s.gold)nat='Medalha de Ouro';else if(n>=s.silver)nat='Medalha de Prata';else if(n>=s.bronze)nat='Medalha de Bronze';else if(n>=s.honorable)nat='Certificado de Menção Honrosa';
 if(s.stateEnabled){if(n>=s.stateGold)est='Medalha de Ouro Regional';else if(n>=s.stateSilver)est='Medalha de Prata Regional';else if(n>=s.stateBronze)est='Medalha de Bronze Regional'}
 return {nat,est}
}
function pill(label){let c=label.includes('Ouro')?'p-gold':label.includes('Prata')?'p-silver':label.includes('Bronze')?'p-bronze':label.includes('estadual')?'p-state':label.includes('Sem premiação')?'p-none':'p-none';return `<span class="pill ${c}">${esc(label)}</span>`}
function cardStat(label,n,sym){return `<div class="card stat"><div><span>${label}</span><strong>${n}</strong></div><div class="symbol">${sym}</div></div>`}
function render(){
 const app=document.getElementById('app');
 if(page==='inicio'){
 const nStudents=data.students.length,nSims=data.simulations.length,nGrades=Object.keys(data.grades).length;
 const possible=Math.max(1,nStudents*nSims),pct=Math.min(100,Math.round(nGrades/possible*100));
 const awards=Object.values(data.grades).map(v=>v?.awards||{});
 const gold=awards.filter(a=>a.nat==='Medalha de Ouro').length, silver=awards.filter(a=>a.nat==='Medalha de Prata').length, bronze=awards.filter(a=>a.nat==='Medalha de Bronze').length, mentions=awards.filter(a=>a.nat==='Certificado de Menção Honrosa').length;

function renderStudents(app){

function studentForm(sid=null){editingStudent=sid;let s=sid?student(sid):{name:'',level:'Nível 1',school:''};let el=document.getElementById('studentform');el.innerHTML=`<section class="card" style="margin-bottom:15px"><h3 style="margin-top:0">${sid?'Editar aluno':'Novo aluno'}</h3><form onsubmit="saveStudent(event,'${sid||''}')"><div class="formgrid"><div class="field"><label>Nome completo *</label><input id="stname" required value="${esc(s.name)}" placeholder="Nome e sobrenome"></div><div class="field"><label>Nível OBMEP *</label><select id="stlevel"><option ${s.level==='Nível 1'?'selected':''}>Nível 1</option><option ${s.level==='Nível 2'?'selected':''}>Nível 2</option><option ${s.level==='Nível 3'?'selected':''}>Nível 3</option></select></div><div class="field"><label>Escola (opcional)</label><input id="stschool" value="${esc(s.school||'')}" placeholder="Nome da escola"></div></div><div class="formactions"><button class="primary">Salvar aluno</button><button type="button" class="light" onclick="document.getElementById('studentform').innerHTML=''">Cancelar</button></div></form></section>`;el.scrollIntoView({behavior:'smooth',block:'start'})}
function saveStudent(e,sid){e.preventDefault();let name=document.getElementById('stname').value.trim().toLocaleUpperCase('pt-BR');if(data.students.some(s=>s.name.toLowerCase()===name.toLowerCase()&&s.id!==sid)){msg('Já existe um aluno com esse nome.');return}let v={id:sid||id(),name,level:document.getElementById('stlevel').value,school:document.getElementById('stschool').value.trim().toLocaleUpperCase('pt-BR')};if(sid)data.students=data.students.map(s=>s.id===sid?v:s);else data.students.push(v);persist();render();msg('Aluno salvo com sucesso.')}

function renderSims(app){

function simForm(sid=null){let s=sid?sim(sid):{name:'',year:2026,level:'Nível 1',gold:96,silver:72,bronze:48,honorable:24,stateEnabled:false,stateGold:84,stateSilver:60,stateBronze:36};document.getElementById('simform').innerHTML=`<section class="card" style="margin-bottom:15px"><h3 style="margin-top:0">${sid?'Editar simulado':'Novo simulado'}</h3><form onsubmit="saveSim(event,'${sid||''}')"><div class="formgrid"><div class="field"><label>Nome do simulado *</label><input id="simname" required value="${esc(s.name)}" placeholder="Ex.: Simulado 1 — 2ª fase"></div><div class="field"><label>Ano</label><input id="simyear" type="number" min="2005" max="2100" value="${s.year}" required></div><div class="field"><label>Nível *</label><select id="simlevel"><option ${s.level==='Nível 1'?'selected':''}>Nível 1</option><option ${s.level==='Nível 2'?'selected':''}>Nível 2</option><option ${s.level==='Nível 3'?'selected':''}>Nível 3</option></select></div></div><div class="subhead">Prêmio Nacional — nota mínima (máximo da prova: 120 pontos)</div><div class="thresholds">${[['Medalha de Ouro','gold'],['Medalha de Prata','silver'],['Medalha de Bronze','bronze'],['Certificado de Menção Honrosa','honorable']].map(([l,k])=>`<div class="field"><label>${l}</label><input id="cut_${k}" type="number" min="0" max="120" step=".5" value="${s[k]}" required></div>`).join('')}</div><label class="checkrow"><input id="stateenabled" type="checkbox" ${s.stateEnabled?'checked':''} onchange="document.getElementById('statecuts').classList.toggle('hidden',!this.checked)"> Incluir premiação estadual (sem menção honrosa)</label><div id="statecuts" class="${s.stateEnabled?'':'hidden'}"><div class="subhead">Prêmio Estadual — nota mínima (máximo da prova: 120 pontos)</div><div class="thresholds">${[['Medalha de Ouro Regional','stateGold'],['Medalha de Prata Regional','stateSilver'],['Medalha de Bronze Regional','stateBronze']].map(([l,k])=>`<div class="field"><label>${l}</label><input id="cut_${k}" type="number" min="0" max="120" step=".5" value="${s[k]}" required></div>`).join('')}</div></div><div class="formactions"><button class="primary">Salvar simulado</button><button type="button" class="light" onclick="document.getElementById('simform').innerHTML=''">Cancelar</button></div></form></section>`;document.getElementById('simform').scrollIntoView({behavior:'smooth',block:'start'})}
function saveSim(e,sid){e.preventDefault();let v={id:sid||id(),name:document.getElementById('simname').value.trim().toLocaleUpperCase('pt-BR'),year:Number(document.getElementById('simyear').value),level:document.getElementById('simlevel').value,stateEnabled:document.getElementById('stateenabled').checked};['gold','silver','bronze','honorable','stateGold','stateSilver','stateBronze'].forEach(k=>v[k]=Number(document.getElementById('cut_'+k)?.value||0));if(!(v.gold>=v.silver&&v.silver>=v.bronze&&v.bronze>=v.honorable)){msg('Organize os cortes nacionais em ordem decrescente: ouro, prata, bronze e menção.');return}if(v.stateEnabled&&!(v.stateGold>=v.stateSilver&&v.stateSilver>=v.stateBronze)){msg('Organize os cortes estaduais em ordem decrescente.');return}if(data.simulations.some(s=>s.name.toLowerCase()===v.name.toLowerCase()&&s.id!==sid&&s.level===v.level)){msg('Já existe um simulado com esse nome e nível.');return}if(sid)data.simulations=data.simulations.map(s=>s.id===sid?v:s);else data.simulations.push(v);persist();render();msg('Simulado salvo.')}
function deleteSim(mid){if(!confirm('Excluir este simulado e todas as notas correspondentes?'))return;data.simulations=data.simulations.filter(s=>s.id!==mid);Object.keys(data.grades).filter(k=>k.endsWith('::'+mid)).forEach(k=>delete data.grades[k]);persist();render();msg('Simulado excluído.')}
function renderSheet(app){
 let sims=data.simulations,students=data.students;
 app.innerHTML=`<div class="sectionhead"><div><h2>Planilha de notas</h2><div class="muted">Os rascunhos são preservados automaticamente. As premiações só são recalculadas ao clicar em SALVAR.</div></div><div class="rowactions"><button class="light" onclick="nav('alunos')">+ Aluno</button><button class="light" onclick="nav('simulados')">+ Simulado</button></div></div>${!sims.length||!students.length?`<section class="card empty"><b>Prepare sua planilha</b><p>Cadastre pelo menos um aluno e um simulado para lançar as notas.</p><div class="formactions" style="justify-content:center"><button class="primary" onclick="nav('alunos')">Cadastrar alunos</button><button class="secondary" onclick="nav('simulados')">Criar simulados</button></div></section>`:`<section class="card" style="margin-bottom:12px;padding:13px"><div class="formgrid"><div class="field"><label>Buscar aluno</label><input class="search" placeholder="Digite um nome..." value="${esc(search)}" oninput="search=this.value;renderSheet(document.getElementById('app'))"></div><div class="field"><label>Filtrar nível</label><select onchange="levelFilter=this.value;renderSheet(document.getElementById('app'))"><option ${levelFilter==='Todos'?'selected':''}>Todos</option><option ${levelFilter==='Nível 1'?'selected':''}>Nível 1</option><option ${levelFilter==='Nível 2'?'selected':''}>Nível 2</option><option ${levelFilter==='Nível 3'?'selected':''}>Nível 3</option></select></div></div></section><div class="tablewrap"><table><thead><tr><th class="studentname">Aluno</th>${sims.map(s=>`<th class="simhead" colspan="1">${esc(s.name)}<br><span style="font-weight:500">${s.year} · ${esc(s.level)}</span></th>`).join('')}</tr><tr><th>Nome do aluno</th>${sims.map(s=>`<th><div class="stacklabels"><span>NOTA</span><span>PRÊMIO NACIONAL</span>${s.stateEnabled?'<span>PRÊMIO ESTADUAL</span>':''}</div></th>`).join('')}</tr></thead><tbody>${students.filter(st=>(levelFilter==='Todos'||st.level===levelFilter)&&(st.name.toLowerCase().includes(search.toLowerCase()))).map(st=>`<tr><td class="studentname">${esc(st.name)}<br><span class="muted small">${esc(st.level)}</span></td>${sims.map(s=>{let key=gradeKey(st.id,s.id),saved=data.grades[key],val=(Object.prototype.hasOwnProperty.call(gradeDraft,key)?gradeDraft[key]:(saved&&typeof saved==='object'?(saved.score??''):saved??'')),aw=saved?.awards;return `<td class="gradecell simblock"><div class="stackrow"><b>NOTA</b><input class="gradeinput" type="text" inputmode="decimal" pattern="[0-9]+([.,][0-9]+)?" aria-label="Nota de ${esc(st.name)} no ${esc(s.name)}" placeholder="0–120" value="${val===''?'':esc(val)}" data-grade="${st.id}::${s.id}" oninput="captureDraft(this)"></div><div class="stackrow"><b>PRÊMIO NACIONAL:</b>${aw?pill(aw.nat):'<span class="muted small">Aguardando SALVAR</span>'}</div>${s.stateEnabled?`<div class="stackrow"><b>PRÊMIO ESTADUAL:</b>${aw?pill(aw.est):'<span class="muted small">Aguardando SALVAR</span>'}</div>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="savebar"><div><strong>SALVAR</strong><div class="muted small">Valida, grava as notas, calcula as premiações e retorna ao início.</div></div><button class="primary" onclick="saveAllGrades()">✓ SALVAR e voltar ao início</button></div>`}`;
}
function saveAllGrades(){
 const keys=Object.keys(gradeDraft),pending={...data.grades};
 for(const key of keys){const raw=String(gradeDraft[key]??'').trim();if(raw===''){delete pending[key];continue}const normalized=raw.replace(',','.');const n=Number(normalized);if(!Number.isFinite(n)||n<0||n>120){const el=document.querySelector(`[data-grade="${CSS.escape(key)}"]`);msg('Nota inválida. Informe um número entre 0 e 120 pontos, usando ponto ou vírgula decimal.');if(el)el.focus();return}const [sid,mid]=key.split('::');const s=sim(mid);if(!student(sid)||!s){msg('Não foi possível associar uma nota ao aluno ou simulado. Confira os cadastros.');return}pending[key]={score:n,awards:classify(n,s),updatedAt:new Date().toISOString()}}
 for(const [key,record] of Object.entries(pending)){const [sid,mid]=key.split('::'),s=sim(mid);if(!student(sid)||!s)continue;const score=Number(record.score);if(Number.isFinite(score)&&score>=0&&score<=100)pending[key]={...record,score,awards:classify(score,s)}}
 const old=data;data={...data,grades:pending,savedAt:new Date().toISOString()};try{persist();localStorage.setItem(KEY,JSON.stringify(data));localStorage.removeItem(DRAFT_KEY);gradeDraft={};page='inicio';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='inicio'));render();msg('Notas salvas, premiações calculadas e dados atualizados com sucesso.')}catch(e){data=old;msg('Erro ao salvar no navegador. Seus rascunhos foram preservados; exporte um backup e tente novamente.')}
}
function renderResults(app){let entries=Object.entries(data.grades).map(([k,v])=>{let [sid,mid]=k.split('::');return {sid,mid,v,st:student(sid),s:sim(mid)}}).filter(x=>x.st&&x.s).sort((a,b)=>b.v.score-a.v.score);app.innerHTML=`<div class="sectionhead"><h2>Resultados e premiações</h2><button class="secondary" onclick="exportCSV()">⇩ Exportar CSV</button></div><section class="card"><div class="grid">${cardStat('Notas calculadas',entries.length,'✓')}${cardStat('Medalhas de ouro nacional',entries.filter(x=>x.v.awards?.nat==='Medalha de Ouro').length,'🥇')}${cardStat('Medalhas de prata nacional',entries.filter(x=>x.v.awards?.nat==='Medalha de Prata').length,'🥈')}${cardStat('Medalhas de bronze nacional',entries.filter(x=>x.v.awards?.nat==='Medalha de Bronze').length,'🥉')}</div></section><section class="card" style="margin-top:15px"><h3 style="margin-top:0">Classificações por aluno e simulado</h3>${entries.length?`<div class="tablewrap"><table><thead><tr><th>Aluno</th><th>Simulado</th><th>Nota</th><th>Prêmio Nacional</th><th>Prêmio Estadual</th></tr></thead><tbody>${entries.map(x=>`<tr><td><b>${esc(x.st.name)}</b><br><span class="muted small">${esc(x.st.level)}</span></td><td>${esc(x.s.name)}<br><span class="muted small">${x.s.year}</span></td><td><b>${x.v.score}</b></td><td>${pill(x.v.awards?.nat||'Não calculada')}</td><td>${x.s.stateEnabled?pill(x.v.awards?.est||'Não calculada'):'Não se aplica'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="emoji">🏆</div><b>Nenhuma nota calculada ainda.</b><p>Preencha a planilha e clique em Salvar notas.</p><button class="primary" onclick="nav('planilha')">Abrir planilha</button></div>`}</section><p class="muted small">As premiações são estimativas baseadas nos cortes que você cadastrou; não representam confirmação oficial da OBMEP.</p>`}
function renderData(app){app.innerHTML=`<div class="sectionhead"><h2>Dados e backup</h2></div><section class="card"><h3 style="margin-top:0">Seus dados ficam guardados</h3><p class="muted">O site grava alunos, simulados, notas e resultados no armazenamento deste navegador. Para evitar perdas, faça backups regulares. O backup pode ser importado em outro dispositivo.</p><div class="grid">${cardStat('Alunos',data.students.length,'♙')}${cardStat('Simulados',data.simulations.length,'▤')}${cardStat('Notas',Object.keys(data.grades).length,'✓')}${cardStat('Último salvamento',data.savedAt?new Date(data.savedAt).toLocaleString('pt-BR'):'Ainda não','◷')}</div><div class="formactions"><button class="primary" onclick="backup()">⇩ Baixar backup completo</button><button class="secondary" onclick="document.getElementById('backupfile').click()">⇧ Restaurar backup</button><input class="hidden" id="backupfile" type="file" accept="application/json,.json" onchange="restoreBackup(event)"></div></section><section class="card" style="margin-top:15px"><h3 style="margin-top:0">Sobre o armazenamento</h3><p>Este arquivo HTML usa armazenamento local do navegador. Os dados persistem ao fechar e abrir novamente no mesmo navegador, mas não são sincronizados automaticamente entre dispositivos e podem ser apagados se os dados do navegador forem limpos.</p><div class="settingsnote"><b>Para sincronizar entre notebook e celular:</b> é preciso publicar o site e conectar um banco de dados online, como Firebase, com as credenciais do projeto. Esta versão não finge ter uma sincronização em nuvem que ainda não foi configurada.</div><div class="formactions"><button class="danger" onclick="clearData()">Apagar todos os dados</button></div></section>`}
function backup(){let blob=new Blob([JSON.stringify({...data,drafts:gradeDraft},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-obmep-simulados.json';a.click();URL.revokeObjectURL(a.href);msg('Backup preparado para download.')}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.students)||!Array.isArray(x.simulations)||typeof x.grades!=='object')throw Error();if(!confirm('Restaurar este backup substituirá os dados atuais. Continuar?'))return;data={...defaults,...x};gradeDraft=x.drafts&&typeof x.drafts==='object'?x.drafts:{};persist();persistDraft();render();msg('Backup restaurado com sucesso.')}catch(err){msg('Arquivo de backup inválido. Nenhum dado foi alterado.')}};r.readAsText(f);e.target.value=''}
function clearData(){if(!confirm('Tem certeza? Todos os alunos, simulados e notas serão apagados deste navegador. Baixe um backup antes, se necessário.'))return;data={...defaults};gradeDraft={};localStorage.removeItem(DRAFT_KEY);persist();render();msg('Dados apagados.')}
function exportCSV(){let rows=[['Aluno','Nível','Simulado','Ano','Nota','Premiação Nacional','Premiação Estadual']];Object.entries(data.grades).forEach(([k,v])=>{let [sid,mid]=k.split('::'),st=student(sid),s=sim(mid);if(st&&s)rows.push([st.name,st.level,s.name,s.year,v.score,v.awards?.nat||'',s.stateEnabled?v.awards?.est||'':'Não se aplica'])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resultados-obmep.csv';a.click();URL.revokeObjectURL(a.href);msg('Relatório CSV exportado.')}
render();
</script></body></html>
